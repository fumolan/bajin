<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bajin notebook</title>
<style>
:root {
  --bg: #1a1b1e; --panel: #1f2125; --panel2: #26282e;
  --border: #2e3138; --text: #e2e4e8; --text-soft: #a8adb5; --dim: #6b7078;
  --accent: #5b9fef; --accent-soft: rgba(91,159,239,.12);
  --ok: #52b874; --warn: #d9b14e; --err: #dd6873;
  --code-bg: #151619; --radius: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }

/* 顶栏 */
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  flex: none;
}
.topbar .logo { font-weight: 700; font-size: 15px; color: var(--accent); }
.topbar select {
  background: var(--panel2); color: var(--text-soft); border: 1px solid var(--border);
  border-radius: 4px; padding: 3px 8px; font-size: 12.5px; cursor: pointer;
}
.topbar .spacer { flex: 1; }
.topbar button {
  background: none; border: 1px solid var(--border); color: var(--text-soft);
  border-radius: 4px; padding: 4px 10px; font-size: 12.5px; cursor: pointer;
}
.topbar button:hover { border-color: var(--accent); color: var(--text); }

/* 主体 */
.main { display: flex; flex: 1; min-height: 0; }

/* 侧栏 */
.sidebar {
  width: 200px; flex: none; background: var(--panel);
  border-right: 1px solid var(--border); padding: 12px 10px;
  display: flex; flex-direction: column; gap: 4px; overflow-y: auto;
}
.sidebar h3 { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; margin: 8px 0 4px; }
.sidebar .info { font-size: 12px; color: var(--text-soft); padding: 4px 6px; }
.sidebar .tool-list { font-size: 11px; color: var(--dim); padding: 2px 6px; line-height: 1.8; }

/* Cell 区域 */
.cells {
  flex: 1; overflow-y: auto; padding: 20px 24px;
  display: flex; flex-direction: column; gap: 16px; max-width: 900px; margin: 0 auto; width: 100%;
}

/* 单个 Cell */
.cell { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.cell.active { border-color: var(--accent); }

.cell-head {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 10px; background: var(--panel2); border-bottom: 1px solid var(--border);
  font-size: 11px; color: var(--dim);
}
.cell-head .cell-label { font-weight: 600; }
.cell-head .spacer { flex: 1; }
.cell-head button {
  background: none; border: none; color: var(--dim); cursor: pointer;
  font-size: 12px; padding: 2px 6px; border-radius: 3px;
}
.cell-head button:hover { color: var(--text); background: var(--panel); }

.cell-input {
  width: 100%; min-height: 60px; max-height: 300px;
  background: transparent; color: var(--text);
  border: none; outline: none; resize: vertical;
  padding: 10px 14px; font: 13.5px/1.6 'SF Mono', 'Fira Code', monospace;
}
.cell-input::placeholder { color: var(--dim); }

.cell-output { padding: 10px 14px; border-top: 1px solid var(--border); display: none; }
.cell-output.visible { display: block; }
.cell-output .streaming { color: var(--text-soft); }

/* 工具卡 */
.tool-item {
  display: flex; align-items: center; gap: 6px;
  padding: 3px 0; font-size: 12px; color: var(--text-soft); cursor: pointer;
}
.tool-item:hover { color: var(--text); }
.tool-item .icon { font-size: 11px; }
.tool-item.ok .icon { color: var(--ok); }
.tool-item.err .icon { color: var(--err); }
.tool-item .output {
  display: none; margin: 4px 0 4px 20px; padding: 6px 10px;
  background: var(--code-bg); border-radius: 4px;
  font: 11.5px/1.5 monospace; color: var(--dim);
  max-height: 200px; overflow-y: auto; white-space: pre-wrap;
}
.tool-item.expanded .output { display: block; }

/* Markdown 渲染 */
.md h1, .md h2, .md h3 { margin: 12px 0 6px; color: var(--text); }
.md h1 { font-size: 18px; } .md h2 { font-size: 16px; } .md h3 { font-size: 14px; }
.md p { margin: 6px 0; }
.md code { background: var(--code-bg); padding: 1px 5px; border-radius: 3px; font: 12px monospace; color: var(--accent); }
.md pre { background: var(--code-bg); padding: 10px 14px; border-radius: 6px; margin: 8px 0; overflow-x: auto; }
.md pre code { background: none; padding: 0; color: var(--text-soft); }
.md ul, .md ol { margin: 6px 0 6px 20px; }
.md li { margin: 2px 0; }
.md blockquote { border-left: 3px solid var(--accent); padding-left: 10px; color: var(--text-soft); margin: 8px 0; }
.md table { border-collapse: collapse; margin: 8px 0; }
.md th, .md td { border: 1px solid var(--border); padding: 4px 10px; font-size: 12.5px; }
.md th { background: var(--panel2); }

/* 底部操作栏 */
.bottom-bar {
  display: flex; gap: 8px; padding: 10px 24px;
  border-top: 1px solid var(--border); background: var(--panel); flex: none;
  justify-content: center;
}
.bottom-bar button {
  background: var(--panel2); border: 1px solid var(--border); color: var(--text-soft);
  border-radius: 6px; padding: 6px 16px; font-size: 13px; cursor: pointer;
}
.bottom-bar button:hover { border-color: var(--accent); color: var(--text); }
.bottom-bar button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.bottom-bar button.stop { background: var(--err); color: #fff; border-color: var(--err); }

/* 状态指示 */
.status-dot {
  width: 8px; height: 8px; border-radius: 50%; flex: none;
  background: var(--dim); transition: background .3s;
}
.status-dot.busy { background: var(--warn); animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: .4; } to { opacity: 1; } }

/* 空状态 */
.empty { text-align: center; padding: 60px 20px; color: var(--dim); }
.empty .icon { font-size: 48px; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">⬡ bajin notebook</span>
  <span class="status-dot" id="statusDot"></span>
  <select id="modelSel" title="模型">
    <option value="glm-4.7">glm-4.7</option>
    <option value="glm-4.7-flash">glm-4.7-flash</option>
    <option value="glm-4.6">glm-4.6</option>
    <option value="glm-5.3">glm-5.3</option>
  </select>
  <select id="modeSel" title="权限模式">
    <option value="build">默认模式</option>
    <option value="plan">计划模式</option>
    <option value="edit">接受编辑</option>
    <option value="yolo">完全访问</option>
  </select>
  <span class="spacer"></span>
  <span id="tokenCount" style="font-size:11px;color:var(--dim)"></span>
  <button onclick="resetAgent()" title="重启内核">⟳ 重启</button>
</div>

<div class="main">
  <aside class="sidebar">
    <h3>状态</h3>
    <div class="info" id="infoCwd">—</div>
    <div class="info" id="infoSession">—</div>
    <h3>工具</h3>
    <div class="tool-list" id="toolList">加载中…</div>
    <h3>快捷键</h3>
    <div class="info" style="font-size:11px;line-height:2">
      Shift+Enter 运行 Cell<br>
      Ctrl+Enter 运行并新增<br>
      Esc 中断任务
    </div>
  </aside>

  <div class="cells" id="cells">
    <div class="empty" id="emptyState">
      <div class="icon">📓</div>
      <div>按 Shift+Enter 运行第一个 Cell</div>
    </div>
  </div>
</div>

<div class="bottom-bar">
  <button class="primary" onclick="addCell()">+ 新增 Cell</button>
  <button onclick="runAll()">▶ 全部运行</button>
  <button class="stop" id="stopBtn" onclick="interrupt()" style="display:none">⏹ 停止</button>
</div>

<script>
'use strict';

// ── 状态 ──
let cells = [];
let activeCellId = null;
let busy = false;
let cellSeq = 0;
let currentOutputEl = null;

// ── SSE 连接 ──
const es = new EventSource('/api/stream');
es.addEventListener('start', (e) => { setBusy(true); });
es.addEventListener('text-delta', (e) => {
  const { delta } = JSON.parse(e.data);
  if (currentOutputEl) {
    currentOutputEl.md = (currentOutputEl.md || '') + delta;
    currentOutputEl.el.innerHTML = renderMd(currentOutputEl.md);
  }
});
es.addEventListener('reasoning-delta', (e) => {
  const { delta } = JSON.parse(e.data);
  // 思考内容暂不渲染（可后续加折叠块）
});
es.addEventListener('tool-call', (e) => {
  const { name, args } = JSON.parse(e.data);
  if (currentOutputEl) addToolItem(currentOutputEl, name, args);
});
es.addEventListener('tool-result', (e) => {
  const { name, ok, output } = JSON.parse(e.data);
  if (currentOutputEl) updateToolItem(currentOutputEl, name, ok, output);
});
es.addEventListener('done', (e) => {
  const { tokens } = JSON.parse(e.data);
  document.getElementById('tokenCount').textContent = tokens > 1000 ? `${Math.round(tokens/1000)}k tk` : `${tokens || ''} tk`;
  setBusy(false);
});
es.addEventListener('error', (e) => {
  if (e.data) {
    const { message } = JSON.parse(e.data);
    if (currentOutputEl) currentOutputEl.el.innerHTML += `<div style="color:var(--err)">⚠ ${message}</div>`;
  }
  setBusy(false);
});
es.addEventListener('interrupted', () => setBusy(false));

// ── Cell 管理 ──
function addCell() {
  const id = ++cellSeq;
  const cell = { id, inputEl: null, outputEl: null };
  cells.push(cell);

  const container = document.getElementById('cells');
  document.getElementById('emptyState')?.remove();

  const div = document.createElement('div');
  div.className = 'cell';
  div.id = `cell-${id}`;
  div.innerHTML = `
    <div class="cell-head">
      <span class="cell-label">In [${id}]</span>
      <span class="spacer"></span>
      <button onclick="runCell(${id})" title="运行">▶</button>
      <button onclick="deleteCell(${id})" title="删除">✕</button>
    </div>
    <textarea class="cell-input" placeholder="输入 prompt…（Shift+Enter 运行）"></textarea>
    <div class="cell-output"></div>
  `;
  container.appendChild(div);

  cell.inputEl = div.querySelector('.cell-input');
  cell.outputWrapper = div.querySelector('.cell-output');
  cell.inputEl.focus();

  // 快捷键
  cell.inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.shiftKey) {
      e.preventDefault();
      runCell(id);
    } else if (e.key === 'Enter' && e.ctrlKey) {
      e.preventDefault();
      runCell(id);
      setTimeout(() => addCell(), 100);
    }
  });

  // 激活状态
  div.addEventListener('click', () => setActive(id));
  setActive(id);
}

function setActive(id) {
  activeCellId = id;
  document.querySelectorAll('.cell').forEach(c => c.classList.remove('active'));
  document.getElementById(`cell-${id}`)?.classList.add('active');
}

function deleteCell(id) {
  const el = document.getElementById(`cell-${id}`);
  if (el) el.remove();
  cells = cells.filter(c => c.id !== id);
}

function runCell(id) {
  const cell = cells.find(c => c.id === id);
  if (!cell || busy) return;
  const prompt = cell.inputEl.value.trim();
  if (!prompt) return;

  // 准备输出区
  cell.outputWrapper.classList.add('visible');
  cell.outputWrapper.innerHTML = '<div class="streaming">▌</div>';
  const outDiv = document.createElement('div');
  outDiv.className = 'md';
  cell.outputWrapper.appendChild(outDiv);
  currentOutputEl = { el: outDiv, md: '', tools: new Map() };

  // 发送
  fetch('/api/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt }),
  }).catch(err => {
    outDiv.innerHTML += `<div style="color:var(--err)">发送失败: ${err.message}</div>`;
    setBusy(false);
  });
}

function runAll() {
  const runnable = cells.filter(c => c.inputEl.value.trim());
  let idx = 0;
  function next() {
    if (idx >= runnable.length) return;
    const cell = runnable[idx++];
    runCell(cell.id);
    // 等待 done 后运行下一个
    const handler = (e) => {
      es.removeEventListener('done', handler);
      setTimeout(next, 200);
    };
    es.addEventListener('done', handler);
  }
  next();
}

function interrupt() {
  fetch('/api/interrupt', { method: 'POST' }).catch(() => undefined);
}

function resetAgent() {
  if (confirm('重启内核？上下文将清空。')) {
    fetch('/api/reset', { method: 'POST' })
      .then(() => location.reload())
      .catch(() => undefined);
  }
}

// ── 工具卡 ──
function addToolItem(output, name, args) {
  const toolDiv = document.createElement('div');
  toolDiv.className = 'tool-item';
  const argStr = typeof args === 'object' ? JSON.stringify(args).slice(0, 80) : String(args);
  toolDiv.innerHTML = `<span class="icon">◐</span> <b>${name}</b> <span style="color:var(--dim)">${argStr}</span>`;
  toolDiv.addEventListener('click', () => toolDiv.classList.toggle('expanded'));
  // 插到 .md div 前面
  output.el.parentNode.insertBefore(toolDiv, output.el);
  output.tools.set(name, toolDiv);
}

function updateToolItem(output, name, ok, output_text) {
  const toolDiv = output.tools.get(name);
  if (!toolDiv) return;
  toolDiv.className = `tool-item ${ok ? 'ok' : 'err'}`;
  toolDiv.querySelector('.icon').textContent = ok ? '✓' : '✗';
  const out = document.createElement('div');
  out.className = 'output';
  out.textContent = output_text.slice(0, 2000);
  toolDiv.appendChild(out);
}

// ── 状态 ──
function setBusy(b) {
  busy = b;
  document.getElementById('statusDot').classList.toggle('busy', b);
  document.getElementById('stopBtn').style.display = b ? '' : 'none';
}

// ── Markdown 渲染（简易）──
function renderMd(text) {
  if (!text) return '';
  let html = text
    // 转义 HTML
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    // 代码块
    .replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code>${code}</code></pre>`)
    // 行内代码
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // 标题
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    // 粗体/斜体
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\*(.+?)\*/g, '<i>$1</i>')
    // 列表
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    // 引用
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    // 换行
    .replace(/\n/g, '<br>');
  // 包装连续 li 为 ul
  html = html.replace(/(<li>.*?<\/li>(<br>)*)+/g, (m) => `<ul>${m.replace(/<br>/g, '')}</ul>`);
  return html;
}

// ── 初始化 ──
document.getElementById('modelSel').addEventListener('change', (e) => {
  fetch('/api/model', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: e.target.value }) }).catch(() => undefined);
});
document.getElementById('modeSel').addEventListener('change', (e) => {
  fetch('/api/mode', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode: e.target.value }) }).catch(() => undefined);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && busy) interrupt();
});

// 刷新状态
function refreshStatus() {
  fetch('/api/status')
    .then(r => r.json())
    .then(s => {
      document.getElementById('infoCwd').textContent = `📁 ${s.cwd?.split('/').pop() || s.cwd}`;
      document.getElementById('infoSession').textContent = `🔑 ${s.sessionId?.slice(0, 12) || '新会话'}`;
      document.getElementById('toolList').innerHTML = (s.tools || []).map(t => `• ${t}`).join('<br>');
      if (s.model) document.getElementById('modelSel').value = s.model;
      if (s.mode) document.getElementById('modeSel').value = s.mode;
    })
    .catch(() => undefined);
}
refreshStatus();
setInterval(refreshStatus, 10000);

// 默认加一个 Cell
addCell();
</script>
</body>
</html>
