appId: ai.bajin.desktop
productName: bajin
executableName: bajin
directories:
  output: release
  buildResources: build

# 应用本体：Electron main/preload + 渲染层静态资源
files:
  - dist/**
  - package.json
  - "!dist/renderer/**/*.map"

# agent 内核：CLI 单文件 bundle（对标 zcode.cjs 的做法）
# 打包后位于 <安装目录>/resources/bajin/bajin.cjs，由 Electron 以
# ELECTRON_RUN_AS_NODE=1 拉起 `bajin.cjs app-server --stdio`
extraResources:
  - from: ../../packages/cli/dist/bundle/bajin.cjs
    to: bajin/bajin.cjs

linux:
  target: [AppImage, deb]
  category: Development
  artifactName: bajin-${version}-${os}-${arch}.${ext}

win:
  target: [nsis, portable]
  artifactName: bajin-${version}-${os}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  artifactName: bajin-${version}-${os}-${arch}.${ext}

# CI 走 GH Actions 手动/打 tag 触发，不自动发布
publish: null
